<!DOCTYPE html>
<html>
<head>
  <title>AiLibas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#000;
      color:white;
      text-align:center;
    }

    .hero{
      padding:60px 20px;
    }

    h1{
      font-size:45px;
      color:gold;
    }

    p{
      color:#ccc;
      font-size:18px;
    }

    .btn{
      background:gold;
      color:black;
      padding:15px 30px;
      border:none;
      border-radius:10px;
      font-size:18px;
      margin-top:20px;
    }

    .box{
      margin:30px;
      padding:20px;
      background:#111;
      border-radius:20px;
    }
  </style>
</head>

<body>

<div class="hero">
  <h1>AiLibas</h1>
  <p>AI Powered Fashion Try-On Platform</p>

  <button class="btn">Upload Photo</button>
</div>

<div class="box">
  <h2>Virtual Try-On</h2>
  <p>See yourself in any outfit using AI.</p>
</div>

<div class="box">
  <h2>Indian Fashion</h2>
  <p>Saree, Kurta, Sherwani and more.</p>
</div>

</body>
</html>
